<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbitlab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Paleta de placa cianotipo: azul de Prusia, tinta color papel y sodio para las estrellas. */
    :root {
      --plate: #0E2F4F;
      --plate-deep: #0A2540;
      --ink: #E6EEF2;
      --ink-dim: #8FA9BD;
      --line: #2B5276;
      --sodium: #F2C14E;
      --error: #F4A193;
      --serif: "Spectral", Georgia, serif;
      --sans: "Atkinson Hyperlegible", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      background: var(--plate);
      color: var(--ink);
      font: 16px/1.5 var(--sans);
      display: grid;
      grid-template-columns: 1fr 22rem;
      /* La página mide lo que la ventana: si el panel es más alto, se desplaza
         él solo y el Canvas no se estira. */
      height: 100vh;
    }

    /* El Canvas ocupa todo su espacio; su tamaño real se ajusta en JS. */
    .plate {
      position: relative;
      background: var(--plate-deep);
      min-height: 60vh;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .panel {
      border-left: 1px solid var(--line);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
    }

    .panel form p { margin: 1rem 0 0; }

    h1 {
      font: 600 2.25rem/1.1 var(--serif);
      margin: 0 0 0.5rem;
      letter-spacing: -0.01em;
    }

    .lede { margin: 0; color: var(--ink-dim); }

    fieldset { border: 0; margin: 0; padding: 0; }

    legend {
      font: 600 1.25rem/1.2 var(--serif);
      margin-bottom: 0.75rem;
      padding: 0;
    }

    .scenario {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0 0.75rem;
      padding: 0.75rem 0;
      border-top: 1px solid var(--line);
      cursor: pointer;
    }

    .scenario:last-of-type { border-bottom: 1px solid var(--line); }

    .scenario input {
      accent-color: var(--sodium);
      margin: 0.3rem 0 0;
      width: 1rem;
      height: 1rem;
    }

    .scenario strong { font-weight: 700; }

    .scenario span { grid-column: 2; color: var(--ink-dim); font-size: 0.9rem; }

    button {
      font: 700 1rem var(--sans);
      border-radius: 4px;
      padding: 0.7rem 1.1rem;
      cursor: pointer;
    }

    .run {
      background: var(--sodium);
      color: var(--plate-deep);
      border: 1px solid var(--sodium);
      width: 100%;
    }

    .run:disabled { opacity: 0.55; cursor: progress; }

    .secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .secondary:hover:not(:disabled) { border-color: var(--ink-dim); }

    button:focus-visible, .scenario input:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .status { min-height: 4.5rem; }

    .status p { margin: 0 0 0.5rem; }

    .status .error { color: var(--error); }

    progress {
      width: 100%;
      height: 6px;
      appearance: none;
      border: 0;
      border-radius: 3px;
      background: var(--line);
      overflow: hidden;
    }

    progress::-webkit-progress-bar { background: var(--line); }
    progress::-webkit-progress-value { background: var(--sodium); }
    progress::-moz-progress-bar { background: var(--sodium); }

    .readout { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.35rem 1rem; }

    .readout dt { color: var(--ink-dim); }

    .readout dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }

    .hint { margin: 0.5rem 0 0; color: var(--ink-dim); font-size: 0.85rem; }

    .controls { display: flex; gap: 0.75rem; }

    .controls button { flex: 1; }

    [hidden] { display: none !important; }

    /* En pantallas angostas el panel va debajo de la placa. */
    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; grid-template-rows: 50vh auto; height: auto; }
      .plate { min-height: 0; }
      .panel { border-left: 0; border-top: 1px solid var(--line); padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>
  <main class="plate">
    <canvas id="plate" aria-label="Animación de las órbitas"></canvas>
  </main>

  <aside class="panel">
    <header>
      <h1>Orbitlab</h1>
      <p class="lede">Simulación de gravedad entre varios cuerpos, calculada en el servidor y animada aquí.</p>
    </header>

    <form id="form">
      <fieldset>
        <legend>Escenario</legend>
        <label class="scenario">
          <input type="radio" name="scenario" value="sol-tierra" checked>
          <strong>Sol y Tierra</strong>
          <span>Una órbita circular de un año, durante 20 años.</span>
        </label>
        <label class="scenario">
          <input type="radio" name="scenario" value="binario">
          <strong>Sistema binario</strong>
          <span>Dos estrellas iguales que giran alrededor de su centro común.</span>
        </label>
        <label class="scenario">
          <input type="radio" name="scenario" value="figura-8">
          <strong>Figura 8</strong>
          <span>Tres cuerpos iguales que se persiguen en forma de ocho.</span>
        </label>
      </fieldset>
      <p><button class="run" id="run" type="submit">Simular</button></p>
    </form>

    <section class="status" aria-live="polite">
      <p id="status-text">Elige un escenario y presiona Simular.</p>
      <progress id="progress" max="1" value="0" hidden></progress>
    </section>

    <section id="results" hidden>
      <dl class="readout">
        <dt>Tiempo</dt>
        <dd id="year">—</dd>
        <dt>Error de energía</dt>
        <dd id="energy">—</dd>
      </dl>
      <p class="hint">Cuánto cambió la energía total del sistema. Menos de 0,1 % indica que el integrador es correcto.</p>
    </section>

    <div class="controls" id="controls" hidden>
      <button class="secondary" id="pause" type="button">Pausar</button>
      <button class="secondary" id="restart" type="button">Repetir</button>
    </div>
  </aside>

  <script>
    const POLL_MS = 500;
    // Fotogramas por segundo de la animación (los datos traen hasta 2.000).
    const FPS = 60;
    // Cuántos fotogramas hacia atrás se dibuja la estela de cada cuerpo.
    const TRAIL = 160;
    // Cuerpos de más de 0,01 masas solares se dibujan como estrellas (decisión del plan).
    const STAR_MASS = 0.01;

    const canvas = document.getElementById("plate");
    const ctx = canvas.getContext("2d");
    const css = getComputedStyle(document.documentElement);
    const color = (name) => css.getPropertyValue(name).trim();

    const ui = {
      form: document.getElementById("form"),
      run: document.getElementById("run"),
      statusText: document.getElementById("status-text"),
      progress: document.getElementById("progress"),
      results: document.getElementById("results"),
      year: document.getElementById("year"),
      energy: document.getElementById("energy"),
      controls: document.getElementById("controls"),
      pause: document.getElementById("pause"),
      restart: document.getElementById("restart"),
    };

    // Estado de la animación actual.
    let sim = null;  // { frames, masses, interval, totalYears, view }
    let frameIndex = 0;
    let playing = false;
    let lastTick = 0;

    // ---------- Comunicación con la API ----------

    async function api(method, path) {
      const response = await fetch(path, { method });
      const body = await response.json();
      if (!response.ok) {
        throw new Error(body.detail || `la API respondió ${response.status}`);
      }
      return body;
    }

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function setStatus(text, isError = false) {
      ui.statusText.textContent = text;
      ui.statusText.classList.toggle("error", isError);
    }

    // POST al escenario, polling del estado y, al terminar, pedir los fotogramas.
    async function runScenario(name) {
      ui.run.disabled = true;
      ui.run.textContent = "Simulando…";
      ui.results.hidden = true;
      ui.controls.hidden = true;
      playing = false;
      sim = null;
      draw();

      try {
        const { id } = await api("POST", `/experiments/from-scenario/${name}`);
        ui.progress.hidden = false;
        ui.progress.value = 0;

        let detail;
        while (true) {
          detail = await api("GET", `/experiments/${id}`);
          ui.progress.value = detail.progress;
          if (detail.status === "pending") {
            setStatus("En cola: esperando un proceso libre.");
          } else if (detail.status === "running") {
            setStatus(`Simulando: ${Math.round(detail.progress * 100)} %`);
          } else {
            break;
          }
          await wait(POLL_MS);
        }

        if (detail.status === "failed") {
          throw new Error(`la simulación falló: ${detail.error_message}`);
        }

        const { frames, frame_interval } = await api("GET", `/experiments/${id}/frames`);
        start(frames, detail, frame_interval);
        setStatus(`${detail.name}: ${frames.length.toLocaleString("es")} fotogramas.`);
      } catch (error) {
        setStatus(`No se pudo simular: ${error.message}.`, true);
      } finally {
        ui.progress.hidden = true;
        ui.run.disabled = false;
        ui.run.textContent = "Simular";
      }
    }

    // ---------- Animación ----------

    function start(frames, detail, interval) {
      sim = {
        frames,
        masses: detail.bodies.map((body) => body.mass),
        interval,
        totalYears: interval * (frames.length - 1),
        view: null,
      };
      ui.energy.textContent = formatScientific(detail.energy_error);
      ui.results.hidden = false;
      ui.controls.hidden = false;
      frameIndex = 0;
      setPlaying(true);
    }

    function setPlaying(value) {
      playing = value;
      ui.pause.textContent = playing ? "Pausar" : "Reanudar";
      if (playing) {
        lastTick = performance.now();
        requestAnimationFrame(tick);
      }
    }

    function tick(now) {
      if (!playing || !sim) return;
      const advance = Math.floor(((now - lastTick) / 1000) * FPS);
      if (advance > 0) {
        lastTick = now;
        frameIndex = Math.min(frameIndex + advance, sim.frames.length - 1);
        draw();
        if (frameIndex === sim.frames.length - 1) {
          setPlaying(false);
          ui.pause.textContent = "Reanudar";
          return;
        }
      }
      requestAnimationFrame(tick);
    }

    // Encaja todas las posiciones de la simulación en el Canvas, con la misma
    // escala en x e y (si no, un círculo se vería como un óvalo).
    function computeView(width, height) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const frame of sim.frames) {
        for (const [x, y] of frame) {
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
      }
      const margin = 0.15;
      const spanX = Math.max(maxX - minX, 1e-6);
      const spanY = Math.max(maxY - minY, 1e-6);
      const scale = Math.min(width / spanX, height / spanY) * (1 - 2 * margin);
      return {
        scale,
        cx: width / 2 - ((minX + maxX) / 2) * scale,
        // En pantalla y crece hacia abajo; en física, hacia arriba.
        cy: height / 2 + ((minY + maxY) / 2) * scale,
      };
    }

    const toScreen = (view, [x, y]) => [view.cx + x * view.scale, view.cy - y * view.scale];

    function draw() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);

      if (!sim) {
        ctx.fillStyle = color("--ink-dim");
        ctx.font = `1rem ${color("--sans")}`;
        ctx.textAlign = "center";
        ctx.fillText("Aquí se animarán las órbitas.", width / 2, height / 2);
        return;
      }

      sim.view ??= computeView(width, height);
      const view = sim.view;
      const bodies = sim.frames[0].length;

      // Estelas: segmentos más transparentes cuanto más viejos.
      ctx.lineWidth = 1.25;
      const first = Math.max(0, frameIndex - TRAIL);
      for (let b = 0; b < bodies; b++) {
        const isStar = sim.masses[b] > STAR_MASS;
        ctx.strokeStyle = isStar ? color("--sodium") : color("--ink");
        for (let i = first + 1; i <= frameIndex; i++) {
          ctx.globalAlpha = 0.6 * ((i - first) / (frameIndex - first + 1));
          const [x0, y0] = toScreen(view, sim.frames[i - 1][b]);
          const [x1, y1] = toScreen(view, sim.frames[i][b]);
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(x1, y1);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;

      // Cuerpos: estrellas grandes con halo; planetas pequeños y sólidos.
      for (let b = 0; b < bodies; b++) {
        const [x, y] = toScreen(view, sim.frames[frameIndex][b]);
        const isStar = sim.masses[b] > STAR_MASS;
        if (isStar) {
          const halo = ctx.createRadialGradient(x, y, 0, x, y, 22);
          halo.addColorStop(0, "rgba(242, 193, 78, 0.45)");
          halo.addColorStop(1, "rgba(242, 193, 78, 0)");
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(x, y, 22, 0, 2 * Math.PI);
          ctx.fill();
        }
        ctx.fillStyle = isStar ? color("--sodium") : color("--ink");
        ctx.beginPath();
        ctx.arc(x, y, isStar ? 7 : 3.5, 0, 2 * Math.PI);
        ctx.fill();
      }

      drawScaleBar(view, height);
      ui.year.textContent = `año ${formatNumber(frameIndex * sim.interval)} de ${formatNumber(sim.totalYears)}`;
    }

    // Regla de escala: elige una longitud redonda que mida entre 60 y 160 px.
    function drawScaleBar(view, height) {
      const options = [0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10];
      const length = options.find((au) => au * view.scale >= 60) ?? options.at(-1);
      const px = length * view.scale;
      const x = 24;
      const y = height - 28;
      ctx.strokeStyle = color("--ink-dim");
      ctx.fillStyle = color("--ink-dim");
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y - 4); ctx.lineTo(x, y); ctx.lineTo(x + px, y); ctx.lineTo(x + px, y - 4);
      ctx.stroke();
      ctx.font = `0.85rem ${color("--sans")}`;
      ctx.textAlign = "left";
      ctx.fillText(`${formatNumber(length)} UA`, x, y - 10);
    }

    // ---------- Formato ----------

    const formatNumber = (value) =>
      value.toLocaleString("es", { maximumFractionDigits: value < 1 ? 2 : 1 });

    // 1.03e-13 → "1,0 × 10⁻¹³"
    function formatScientific(value) {
      if (value === 0) return "0";
      const [mantissa, exponent] = value.toExponential(1).split("e");
      const superscript = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
      const power = String(Number(exponent)).split("").map((c) => superscript[c]).join("");
      return `${mantissa.replace(".", ",")} × 10${power}`;
    }

    // ---------- Tamaño del Canvas ----------

    // Dibuja a la resolución real de la pantalla para que las líneas no se vean borrosas.
    function resize() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * ratio;
      canvas.height = canvas.clientHeight * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      if (sim) sim.view = null;
      draw();
    }

    // ---------- Eventos ----------

    ui.form.addEventListener("submit", (event) => {
      event.preventDefault();
      runScenario(new FormData(ui.form).get("scenario"));
    });

    ui.pause.addEventListener("click", () => {
      if (!playing && frameIndex === sim.frames.length - 1) frameIndex = 0;
      setPlaying(!playing);
    });

    ui.restart.addEventListener("click", () => {
      frameIndex = 0;
      draw();
      if (!playing) setPlaying(true);
    });

    window.addEventListener("resize", resize);
    document.fonts.ready.then(resize);
    resize();
  </script>
</body>
</html>
